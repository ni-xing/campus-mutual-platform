# API 网关：路由 + JWT 统一鉴权 + 全局限流（W1 接入 spring-cloud-starter-gateway）
server:
  port: 8080

spring:
  application:
    name: campus-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: info
    com.campus: debug
