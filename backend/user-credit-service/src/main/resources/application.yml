# M1 用户与信用服务：注册登录 / 信用分 / 隐私同意（specs/05）
# 环境变量统一由 docker/.env 注入（L4 Secret 不入代码，见《安全设计》§6）
server:
  port: 8081

spring:
  application:
    name: user-credit-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # W1：Nacos 配置中心（optional 前缀：Nacos 不可用时降级本地配置，便于 IDE 直跑）
  config:
    import: optional:nacos:user-credit-service-${spring.profiles.active}.yml
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:127.0.0.1}:8848
      # SB-01：Nacos 鉴权开启，客户端须携带账号（.env 注入）
      username: ${NACOS_USER:}
      password: ${NACOS_PASSWORD:}
      config:
        namespace: public
      discovery:
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/user_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:campus_user}
    password: ${DB_PWD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

# M1 业务配置（campus.*，见 CampusProperties）
# JWT_SECRET 为 L4 凭证：本地 IDE 直跑时请设置环境变量（>=32 字节），容器方式由 .env 注入
campus:
  jwt:
    secret: ${JWT_SECRET:}
    expire-hours: 2
  email:
    allowed-domains:
      - stu.campus.edu.cn
  login:
    max-fail: 5
    lock-minutes: 15
  privacy:
    current-version: v1.0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SB-03：Actuator 仅暴露 liveness/readiness，管理端口不映射公网（《安全设计》§5.3）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: info
    com.campus: debug
